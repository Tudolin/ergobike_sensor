name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

      - name: Check tag matches package version
        shell: bash
        run: |
          version=$(python -c "import ergobike; print(ergobike.__version__)")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: pyinstaller --noconfirm packaging/ergobike.spec

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/ErgoBike -DestinationPath "ErgoBike-$env:VERSION-windows-x64.zip"

      - name: Release notes from CHANGELOG
        shell: bash
        run: awk -v v="## $VERSION" '$0 ~ "^"v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "ErgoBike-$VERSION-windows-x64.zip" --title "ErgoBike $VERSION" --notes-file notes.md
