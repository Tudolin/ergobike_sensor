[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ergobike-sensor"
version = "1.1.0"
description = "Cadence tracker for exercise bikes with a reed switch, read through the PC mic input"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Tudolin" }]
dependencies = [
    "numpy>=2.0",
    "sounddevice>=0.5",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "websockets>=12",
    "pywebview>=5.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pyinstaller>=6.10"]

[project.scripts]
ergobike = "ergobike.__main__:main"

[tool.setuptools.packages.find]
include = ["ergobike*"]

[tool.setuptools.package-data]
ergobike = ["web/*", "web/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore:Using `httpx`"]
